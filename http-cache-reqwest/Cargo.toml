[package]
name = "http-cache-reqwest"
version = "1.0.0-alpha.9"
description = "http-cache middleware implementation for reqwest"
authors = [
    "Christian Haynes <06chaynes@gmail.com>",
    "Kat Marchán <kzm@zkat.tech>",
]
repository = "https://github.com/06chaynes/http-cache"
homepage = "https://http-cache.rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cache", "http", "middleware", "reqwest"]
categories = ["caching", "web-programming::http-client"]
edition = "2024"
rust-version = "1.89.0"

[dependencies]
anyhow = "1.0.95"
async-trait = { version = "0.1.85", optional = true }
bytes = "1.8.0"
http = "1.2.0"
http-body = "1.0.1"
http-body-util = "0.1.2"
http-cache-semantics = "3.0.0"
reqwest = { version = "0.13.1", default-features = false, features = [
    "stream",
] }
reqwest-middleware = { version = "0.5.0", optional = true }
middlewest = { version = "0.1", optional = true }
url = { version = "2.5.4", features = ["serde"] }

# Optional dependencies for streaming feature
futures-util = { version = "0.3.31", optional = true }

[dependencies.http-cache]
path = "../http-cache"
version = "1.0.0-alpha.8"
default-features = false

[dev-dependencies]
bincode = "1.3.3"
cacache = { version = "13.1.0", default-features = false, features = ["tokio-runtime"] }
http-cache-semantics = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.43.0", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "net",
    "io-util",
    "sync",
] }
wiremock = "0.6.0"
tempfile = "3.13.0"
bytes = "1.8.0"
http-body = "1.0.1"
http-body-util = "0.1.2"
futures-util = "0.3.31"
# Used only by the issue-#164 memory gate in examples/reqwest_streaming_memory_profile.rs.
axum = "0.8"
libc = "0.2"

[[example]]
name = "reqwest_streaming_memory_profile"
required-features = ["streaming", "manager-cacache", "reqwest-middleware"]

[[example]]
name = "reqwest_basic"
required-features = ["manager-cacache", "reqwest-middleware"]

[[example]]
name = "reqwest_streaming"
required-features = ["streaming", "reqwest-middleware"]

[features]
default = ["manager-redb", "url-standard", "reqwest-middleware"]
reqwest-middleware = ["dep:reqwest-middleware", "dep:async-trait"]
middlewest = ["dep:middlewest"]
redirect = ["middlewest?/redirect"]
manager-cacache = ["http-cache/manager-cacache"]
manager-moka = ["http-cache/manager-moka"]
manager-foyer = ["http-cache/manager-foyer"]
manager-redb = ["http-cache/manager-redb"]
streaming = ["http-cache/streaming", "reqwest/stream", "futures-util"]
rate-limiting = ["http-cache/rate-limiting"]
url-standard = ["http-cache/url-standard"]
url-ada = ["http-cache/url-ada"]
http-headers-compat = ["http-cache/http-headers-compat"]
manager-cacache-bincode = ["http-cache/manager-cacache-bincode"]
manager-moka-bincode = ["http-cache/manager-moka-bincode"]

[package.metadata.docs.rs]
# The two client backends (reqwest-middleware, middlewest) are mutually exclusive,
# so docs are built on the default reqwest-middleware backend rather than all-features.
no-default-features = true
features = [
    "reqwest-middleware",
    "streaming",
    "rate-limiting",
    "http-headers-compat",
    "manager-cacache",
    "manager-moka",
    "manager-foyer",
    "manager-redb",
    "url-standard",
]
rustdoc-args = ["--cfg", "docsrs"]
